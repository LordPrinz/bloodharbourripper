# Central, per-version configuration. See https://stonecutter.kikugie.dev/wiki/config/properties
# Sections are matched by tags: ["<mc>"] applies to every loader, [<loader>."<mc>"] to one node.

mod.id = "bloodharbourripper"
mod.name = "Blood Harbour Ripper"
mod.group = "net.lordprinz.bloodharbourripper"
# Bump this on every release (semver). The published version becomes `<mod.version>+<mc>-<loader>`.
mod.version = "1.1.0"
mod.authors = "LordPrinz"
mod.license = "All Rights Reserved"
mod.description = "A dark, sea-themed weapon mod: throwable Bone Skewers, executions and the Phantom Undertow dash."

# Publishing (fill in the project IDs once the projects exist; tokens come from env vars)
publish.modrinth_id = ""
publish.curseforge_id = ""
# release | beta | alpha
publish.type = "release"

deps.fabric_loader = "0.19.5"

# --- 1.20.1 -------------------------------------------------------------------
["1.20.1"]
mod.mc_releases = ["1.20.1"]
mod.java = 17

[fabric."1.20.1"]
mod.mc_compat = "~1.20.1"
deps.fabric_api = "0.92.12+1.20.1"

[forge."1.20.1"]
mod.mc_compat = "[1.20.1, 1.20.2)"
deps.forge = "1.20.1-47.4.26"

