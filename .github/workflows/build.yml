name: Build

# Every push and pull request is compiled against ALL supported Minecraft versions and loaders.
# A change that breaks any of them fails here — that is the backward-compatibility safety net.
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 17 → 1.20.1, 21 → 1.21.x, 25 → 26.x (and runs Gradle)
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build all versions
        run: ./gradlew buildAndCollect --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: bloodharbourripper-jars
          path: build/libs/
